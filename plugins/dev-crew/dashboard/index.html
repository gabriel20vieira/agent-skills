<title>Dev Crew Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an ops board. A strip of per-model capacity gauges, then the crew as an indented tree. */
:root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #1b2230;
    --muted: #5d6677;
    --line: #dde1e8;
    --accent: #2f5bd3;
    --opus: #6a4bc4;
    --sonnet: #0d7a6b;
    --haiku: #a8670f;
    --ok: #237a3b;
    --warn: #a86400;
    --bad: #b42323;
    --idle: #7a8394;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #11141a; --surface: #191d25; --fg: #e4e8ef; --muted: #98a1b2; --line: #2a303b;
        --accent: #7b9cf5; --opus: #a891f0; --sonnet: #4cc4b0; --haiku: #e0a64e;
        --ok: #5cc27a; --warn: #e3a23f; --bad: #f07070; --idle: #8a93a4; color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #11141a; --surface: #191d25; --fg: #e4e8ef; --muted: #98a1b2; --line: #2a303b;
    --accent: #7b9cf5; --opus: #a891f0; --sonnet: #4cc4b0; --haiku: #e0a64e;
    --ok: #5cc27a; --warn: #e3a23f; --bad: #f07070; --idle: #8a93a4; color-scheme: dark;
}
body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 32px;
}
main { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.01em; }
h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.mono, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.run-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
select, input[type="number"] {
    font: inherit; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
}
select { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; color: var(--muted); }
.notice strong { color: var(--fg); }
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.gauge { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.gauge-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gauge-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.gauge-count { font-size: 1.4rem; }
.gauge-count small { color: var(--muted); font-size: 0.9rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 3px; }
.limit { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; }
.limit input { width: 4.5em; }
.totals { display: grid; gap: 4px; align-content: start; }
.totals .row { display: flex; justify-content: space-between; gap: 8px; }
.totals .row span:first-child { color: var(--muted); }
.estimate { color: var(--muted); font-size: 0.8rem; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tree ul { padding-left: 22px; border-left: 1px dashed var(--line); margin-left: 10px; margin-top: 8px; }
.node { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--model, var(--idle)); border-radius: 6px; min-width: 0; }
.node summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 4px; }
.node summary::-webkit-details-marker { display: none; }
.node-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.node-id { font-weight: 600; }
.node-task { color: var(--muted); overflow-wrap: anywhere; }
.chip { font-family: var(--font-data); font-size: 0.75rem; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.model { color: var(--model); }
.status { color: var(--state, var(--idle)); }
.stale { color: var(--warn); }
.meta { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.detail { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.detail p { margin: 0; max-width: 65ch; overflow-wrap: anywhere; }
.failures { margin: 0; padding: 8px 10px; background: var(--bg); border-radius: 4px; overflow-x: auto; font-size: 0.8rem; white-space: pre; }
.verdict { font-size: 0.85rem; }
.empty { text-align: left; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width 0.3s ease; } }
</style>

<main>
    <header>
        <div>
            <h1>Dev Crew Board</h1>
            <div class="meta" id="run-meta"></div>
        </div>
        <label class="run-pick" for="run-select">
            <span class="estimate">Run</span>
            <select id="run-select" disabled><option>No runs yet</option></select>
        </label>
    </header>

    <div class="notice" id="no-db" hidden>
        <strong>The board can't reach its data.</strong> Open it signed in to claude.ai, from the account that published it.
    </div>

    <section aria-labelledby="capacity-title">
        <h2 id="capacity-title">Running now / limit</h2>
        <div class="gauges" id="gauges"></div>
    </section>

    <section aria-labelledby="crew-title">
        <h2 id="crew-title">Crew</h2>
        <div id="crew"></div>
    </section>
</main>

<script type="module">
import { MODELS, buildTree, countRunning, estimateCost, isStale, normalizeLimits } from "./logic.js"

const STATE_COLOR = {
    queued: "--idle", running: "--accent", fixing: "--warn", passed: "--ok", accepted: "--ok",
    done: "--ok", failed: "--bad", rejected: "--bad", stopped: "--idle",
}
const ROLE_ORDER = { main: 0, scribe: 1, coordinator: 2, developer: 3, checker: 4 }
const view = { db: null, runs: [], runId: null, agents: [], limits: normalizeLimits(null), stopAgents: null }

function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag)
    for (const [key, value] of Object.entries(attrs)) {
        if (key === "style") for (const [prop, val] of Object.entries(value)) node.style.setProperty(prop, val)
        else if (value !== undefined && value !== null) node.setAttribute(key, value)
    }
    for (const child of children) if (child !== null && child !== undefined) node.append(child)
    return node
}

function stateChip(status) {
    return el("span", { class: "chip status", style: { "--state": `var(${STATE_COLOR[status] ?? "--idle"})` } }, status ?? "unknown")
}

function since(iso) {
    const ms = Date.now() - Date.parse(iso)
    if (!Number.isFinite(ms)) return "-"
    const minutes = Math.floor(ms / 60000)
    if (minutes < 1) return "just now"
    if (minutes < 60) return `${minutes} min ago`
    return `${Math.floor(minutes / 60)} h ${minutes % 60} min ago`
}

function remember(runId) {
    try { localStorage.setItem("dev-crew-run", runId) } catch {}
}
function recalled() {
    try { return localStorage.getItem("dev-crew-run") } catch { return null }
}

function renderGauges() {
    const now = Date.now()
    const running = countRunning(view.agents, now)
    const gauges = document.getElementById("gauges")
    // A limit input being edited is kept as is, so a re-render does not wipe what the user typed.
    const editing = gauges.contains(document.activeElement) && document.activeElement.matches("input") ? document.activeElement : null
    gauges.textContent = ""
    for (const model of MODELS) {
        const limit = view.limits[model]
        const share = limit > 0 ? Math.min(100, (running[model] / limit) * 100) : 100
        const over = running[model] >= limit
        let input = editing?.id === `limit-${model}` ? editing : null
        if (!input) {
            input = el("input", { type: "number", min: "0", max: "20", step: "1", id: `limit-${model}`, value: String(limit) })
            input.addEventListener("change", () => {
                saveLimit(model, input.value)
                input.value = String(view.limits[model])
            })
        }
        input.disabled = !view.db
        gauges.append(el("div", { class: "gauge" },
            el("div", { class: "gauge-head" },
                el("span", { class: "gauge-name", style: { color: `var(--${model})` } }, model[0].toUpperCase() + model.slice(1)),
                el("span", { class: "gauge-count num" }, String(running[model]), el("small", {}, ` / ${limit}`))),
            el("div", { class: "bar", role: "img", "aria-label": `${running[model]} of ${limit} running` },
                el("span", { style: { width: `${share}%`, background: over ? "var(--warn)" : `var(--${model})` } })),
            el("label", { class: "limit", for: `limit-${model}` }, "Max at once", input)))
    }
    const tokens = view.agents.reduce((sum, agent) => sum + (agent.tokens ?? 0), 0)
    gauges.append(el("div", { class: "gauge totals" },
        el("span", { class: "gauge-name" }, "This run"),
        el("div", { class: "row" }, el("span", {}, "Agents"), el("span", { class: "num" }, String(view.agents.length))),
        el("div", { class: "row" }, el("span", {}, "Tokens"), el("span", { class: "num" }, tokens.toLocaleString("en-US"))),
        el("div", { class: "row" }, el("span", {}, "Cost"), el("span", { class: "num" }, `~$${estimateCost(view.agents).toFixed(2)}`)),
        el("span", { class: "estimate" }, "Estimate: all tokens priced at output rates")))
    // Clearing the gauges blurred the kept input: give it its focus back.
    if (editing && document.activeElement !== editing) editing.focus()
}

function renderNode(node) {
    const agent = node.agent
    const stale = isStale(agent, Date.now())
    const failures = agent.lastCheck?.failures ?? []
    const check = agent.lastCheck ? (agent.lastCheck.ok ? "check PASS" : `check FAIL (${failures.length})`) : null
    const children = [...node.children].sort((a, b) => (ROLE_ORDER[a.agent.role] ?? 9) - (ROLE_ORDER[b.agent.role] ?? 9) || String(a.agent.id).localeCompare(String(b.agent.id)))
    const details = el("details", { class: "node", style: { "--model": `var(--${agent.model ?? "idle"})` } },
        el("summary", {},
            el("div", { class: "node-top" },
                el("span", { class: "node-id mono" }, agent.id),
                el("span", { class: "chip model" }, agent.model ?? "?"),
                stateChip(agent.status),
                stale ? el("span", { class: "chip stale" }, "no signal") : null,
                agent.area ? el("span", { class: "estimate" }, agent.area) : null),
            agent.task ? el("span", { class: "node-task" }, agent.task) : null,
            el("div", { class: "meta" },
                el("span", {}, agent.role ?? "agent"),
                agent.loops ? el("span", { class: "num" }, `${agent.loops} fix round${agent.loops === 1 ? "" : "s"}`) : null,
                check ? el("span", {}, check) : null,
                agent.tokens ? el("span", { class: "num" }, `${agent.tokens.toLocaleString("en-US")} tokens`) : null,
                agent.updatedAt ? el("span", {}, `updated ${since(agent.updatedAt)}`) : null)),
        el("div", { class: "detail" },
            agent.verdict ? el("p", { class: "verdict" }, el("strong", {}, "Verdict: "), agent.verdict) : null,
            el("p", {}, agent.summary || "No summary yet."),
            failures.length ? el("pre", { class: "failures mono" }, failures.map((f) => `${f.file}:${f.line ?? "-"}: ${f.message}`).join("\n")) : null))
    const item = el("li", {}, details)
    if (children.length) item.append(el("ul", {}, ...children.map(renderNode)))
    return item
}

function renderCrew() {
    const crew = document.getElementById("crew")
    crew.textContent = ""
    if (!view.runId) {
        crew.append(el("div", { class: "notice empty" },
            el("strong", {}, "No runs yet. "),
            "Ask Claude to build something with the dev crew. Each agent appears here as it starts, under the agent that launched it."))
        return
    }
    if (!view.agents.length) {
        crew.append(el("div", { class: "notice empty" }, "This run has no agents yet."))
        return
    }
    const roots = buildTree(view.agents).sort((a, b) => (ROLE_ORDER[a.agent.role] ?? 9) - (ROLE_ORDER[b.agent.role] ?? 9))
    crew.append(el("ul", { class: "tree" }, ...roots.map(renderNode)))
}

function renderRuns() {
    const select = document.getElementById("run-select")
    select.textContent = ""
    if (!view.runs.length) {
        select.append(el("option", {}, "No runs yet"))
        select.disabled = true
    } else {
        for (const run of view.runs) {
            const option = el("option", { value: run.id }, `${run.title || run.id} · ${run.status ?? "?"}`)
            option.selected = run.id === view.runId
            select.append(option)
        }
        select.disabled = false
    }
    const meta = document.getElementById("run-meta")
    meta.textContent = ""
    const run = view.runs.find((item) => item.id === view.runId)
    if (run) {
        meta.append(stateChip(run.status), el("span", {}, `started ${since(run.startedAt)}`))
        if (run.verdict) meta.append(el("span", {}, run.verdict))
    }
}

function render() {
    renderRuns()
    renderGauges()
    renderCrew()
}

async function saveLimit(model, value) {
    if (!view.db) return
    const next = normalizeLimits({ ...view.limits, [model]: value })
    view.limits = next
    render()
    try {
        await view.db.doc("config/limits").set(next)
    } catch (error) {
        console.error("Could not save the limit", error)
    }
}

function selectRun(runId) {
    if (view.runId === runId && view.stopAgents) return render()
    view.runId = runId
    view.agents = []
    if (view.stopAgents) view.stopAgents()
    view.stopAgents = null
    if (runId) {
        remember(runId)
        view.stopAgents = view.db.collection(`runs/${runId}/agents`).onSnapshot((snap) => {
            view.agents = snap.docs.map((doc) => ({ ...doc.data(), id: doc.id }))
            render()
        }, (error) => console.error("Agents feed stopped", error))
    }
    render()
}

document.getElementById("run-select").addEventListener("change", (event) => selectRun(event.target.value))

render()
// Outside the artifact host there is no `claude` runtime: show the notice instead of failing.
let db = null
try {
    db = await globalThis.claude?.use?.("db")
} catch (error) {
    console.error("Could not open the board's data", error)
}
if (!db) {
    document.getElementById("no-db").hidden = false
} else {
    view.db = db
    render()
    db.doc("config/limits").onSnapshot((snap) => {
        view.limits = normalizeLimits(snap.exists ? snap.data() : null)
        render()
    }, (error) => console.error("Limits feed stopped", error))
    db.collection("runs").onSnapshot((snap) => {
        view.runs = snap.docs.map((doc) => ({ ...doc.data(), id: doc.id }))
            .sort((a, b) => String(b.startedAt ?? "").localeCompare(String(a.startedAt ?? "")))
        const keep = view.runs.some((run) => run.id === view.runId) ? view.runId : null
        const wanted = recalled()
        const next = keep ?? (view.runs.some((run) => run.id === wanted) ? wanted : view.runs[0]?.id ?? null)
        selectRun(next)
    }, (error) => console.error("Runs feed stopped", error))
    setInterval(render, 30000)
}
</script>
